<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tizco Solution</title>
  <!-- Link to external CSS -->
  <link rel="stylesheet" href="Style4.css">
</head>
<body>
  <header>
    <h1>Tizco Solution</h1>
  </header>

  <div class="login-container">
    <h2>Sign In</h2>
    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="text" placeholder="Contact Number" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <!-- Example dashboard after login -->
  <div class="dashboard">
    <h3>Welcome to Tizco Solution</h3>
    <p>Here you can view tasks, gadgets, and your account summary.</p>
    <!-- Placeholder links -->
    <a href="#">View Tasks</a> | <a href="#">Shop Gadgets</a> | <a href="#">Account</a>
  </div>
</body>
</html>
